title: "hakarido— AIコードを測って壊す"
description: "AIが書いたコードを、毎週1本、自分の手で測って壊す実測記録。表・スクショ・再現リポジトリつき。下書きにAI使用、実測と確認は全件本人。"
url: "https://hakarido.github.io"
baseurl: ""
lang: ja

theme: minima
minima:
  skin: classic

permalink: /:year/:month/:title/
paginate: 10

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      affiliate: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
